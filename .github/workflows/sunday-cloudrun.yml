name: Sunday Cloud Run Image

on:
  push:
    branches:
      - feature/sunday-plugin
      - main
    paths:
      - "extensions/sunday/**"
      - "Dockerfile"
      - "extensions/sunday/deploy/**"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: sunday-cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/openclaw-sunday

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/sunday/deploy/Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
